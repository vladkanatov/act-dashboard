version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: instagram_dashboard_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: instagram_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d instagram_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instagram_dashboard_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # database URL points to the postgres service inside the compose network
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/instagram_dashboard"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
